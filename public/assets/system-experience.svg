    <text x="1096" y="522" font-size="16" fill="#667085">Conversion lift</text>
    <text x="1096" y="556" font-size="27" font-weight="800" fill="#101828">+38%</text>
    <path d="M1096 600 C 1140 596, 1180 580, 1220 572 S 1300 560, 1380 542" stroke="#12B76A" stroke-width="5" fill="none" stroke-linecap="round"/>
