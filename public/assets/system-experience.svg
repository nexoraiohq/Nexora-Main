  <g filter="url(#esh)"><circle cx="760" cy="360" r="34" fill="#FFFFFF"/></g>
  <circle cx="760" cy="360" r="34" fill="#EAF0FF" stroke="#2F6BFF" stroke-width="4"/>
  <path d="M748 360 h24 M760 348 v24" stroke="#2F6BFF" stroke-width="4" stroke-linecap="round"/>
  <g filter="url(#esh)"><circle cx="1060" cy="360" r="34" fill="#FFFFFF"/></g>
  <circle cx="1060" cy="360" r="34" fill="#E0F7FB" stroke="#00B8D9" stroke-width="4"/>
  <path d="M1046 366 l8 -10 l7 7 l10 -13" stroke="#0093B8" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <g filter="url(#esh)"><circle cx="1360" cy="360" r="34" fill="#FFFFFF"/></g>
