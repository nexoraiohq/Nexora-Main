<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" width="1536" height="1024" role="img" aria-label="Customer journey experience dashboard illustration">
  <defs>
    <linearGradient id="ebg" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#FFE4EF"/>
      <stop offset=".55" stop-color="#F6F7FB"/>
      <stop offset="1" stop-color="#E0F4FF"/>
    </linearGradient>
    <filter id="esh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="26" flood-color="#8B93A7" flood-opacity=".22"/>
    </filter>
    <linearGradient id="eacc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00B8D9"/>
      <stop offset="1" stop-color="#2F6BFF"/>
    </linearGradient>
  </defs>
  <rect width="1536" height="1024" fill="url(#ebg)"/>
  <ellipse cx="110" cy="970" rx="520" ry="340" fill="#FFC9DE" opacity=".42"/>
  <ellipse cx="1460" cy="80" rx="420" ry="300" fill="#C9E9FF" opacity=".55"/>

  <g font-family="SF Pro Display, Inter, Arial, sans-serif">
    <rect x="88" y="150" width="74" height="58" rx="14" fill="none" stroke="#00B8D9" stroke-width="3"/>
